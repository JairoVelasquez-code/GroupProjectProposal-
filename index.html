<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cue the credits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CSIT 337 Movie Watchlist | Jairo Velasquez, Chris Paskas, Joseph Moreno -->
  <!-- JavaScript by Jairo Velasquez. -->

  <header id="watchlist-header">
    <h1>Cue The Credits</h1>
    <p class="motto">Track it. Watch it. Rate it.</p>
    <nav>
      <a href="#movie-grid">My Movies</a>
      <a href="#add-form">Add a Movie</a>
      <a href="mailto:?subject=My%20movie%20watchlist&body=Come%20build%20your%20own%20movie%20watchlist%20with%20me!">Share with friends</a>
    </nav>
  </header>

  <main id="watchlist-view">

    <section class="controls">

      <form id="add-form">
        <input type="text" id="title-input" placeholder="Movie title" required>
        <select id="genre-input">
          <option>Action</option>
          <option>Adventure</option>
          <option>Animation</option>
          <option>Comedy</option>
          <option>Crime</option>
          <option>Drama</option>
          <option>Horror</option>
          <option>Sci-Fi</option>
        </select>
        <button type="submit">Add Movie</button>
      </form>

      <div class="filter">
        <label for="status-filter">Show:</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="to-watch">To Watch</option>
          <option value="watched">Watched</option>
        </select>
      </div>

    </section>

    <section id="movie-grid"></section>

  </main>

  <header id="detail-header" hidden>
    <nav aria-label="Watchlist navigation">
      <a href="index.html">Back to My Movies</a>
    </nav>
  </header>

  <main id="detail-view" hidden>
    <article id="movie-detail" class="card" aria-labelledby="detail-title">
      <img id="detail-poster" alt="" hidden>
      <div id="detail-hero" hidden>
        <img id="detail-art" alt="">
      </div>
      <div class="detail-copy">
        <p id="detail-genre"></p>
        <h1 id="detail-title">Movie Details</h1>
        <p id="detail-synopsis" hidden></p>
        <section id="detail-credits" aria-label="Cast and crew" hidden>
          <dl>
            <div><dt>Director</dt><dd id="detail-director"></dd></div>
            <div><dt>Cast</dt><dd id="detail-cast"></dd></div>
          </dl>
        </section>
        <div id="detail-controls"></div>
      </div>
    </article>
    <section id="detail-extras" hidden>
      <section class="preview-panel" aria-labelledby="trailer-heading">
        <h2 id="trailer-heading">Trailer</h2>
        <div id="trailer-player" hidden></div>
        <button id="play-trailer" type="button">Play trailer</button>
        <a id="detail-trailer" target="_blank" rel="noopener">Watch on YouTube ↗</a>
      </section>
      <section class="preview-panel" aria-labelledby="reviews-heading">
        <h2 id="reviews-heading">Reviews</h2>
        <a id="detail-reviews" target="_blank" rel="noopener">Read critic and audience reviews on Rotten Tomatoes ↗</a>
      </section>
    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
